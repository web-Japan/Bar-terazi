<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b0f">
<title>今夜の一杯を。</title>
<meta name="description" content="今夜くらい、飲んで忘れよう。">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="night-backdrop" aria-hidden="true"></div>

  <section class="answer-hero">
    <p class="transition-line-static">そんな貴方に。</p>
    <div class="scroll-hint" aria-hidden="true">
      <span>SCROLL</span>
      <span class="chevron"></span>
    </div>
  </section>

  <section class="answer-body">
    <p class="section-copy">今夜くらい、<br>飲んで忘れよう。</p>

    <!-- ============================================================
         店舗紹介エリア
         ------------------------------------------------------------
         店舗名・コピー・住所などはこの中身を書き換えるだけでOK。
         クラス名やid（route-button等）は変更しないでください。
    ============================================================= -->
    <div class="shop-card">
      <!-- ▼店舗名：ここを変更してください -->
      <p class="shop-name">BAR XXXXX</p>

      <p class="shop-lines">
        仕事終わりに。<br>
        友達と。<br>
        ひとりでふらっと。
      </p>

      <p class="shop-tagline">今夜の一杯を。</p>
    </div>

    <!-- 「現在地から徒歩○分」などを将来的に入れるための領域。
         中身は空でも表示上は問題ないよう最小限のスタイルにしてあります。
         例：<p>現在地から徒歩5分</p> のように差し替えてください。 -->
    <p class="walk-time" id="walkTime"><!-- 例: 現在地から徒歩5分 --></p>

    <!-- ============================================================
         GoogleマップへのCTA
         ------------------------------------------------------------
         href内のURLを、実際の店舗のGoogleマップURLに差し替えてください。
         「共有」→「リンクをコピー」で取得したURLをそのまま貼り付けてOKです。
    ============================================================= -->
    <!-- ▼hrefの中身を、実際の店舗のGoogleマップURLに変更してください -->
    <a
      id="routeButton"
      class="route-button"
      href="https://maps.app.goo.gl/XXXXXXXXXXXXXXXX"
      target="_blank"
      rel="noopener noreferrer"
    >お店までのルートを見る</a>

    <p class="route-caption">タップするとGoogleマップが開きます</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
